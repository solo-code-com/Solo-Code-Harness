name: CI — Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS is deliberately absent: no macOS machine is available to reproduce or verify a
      # failure, so a macOS-only red would be a guess, not a gate. Re-add it together with a
      # way to reproduce its failures.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
        shell: bash

      - name: Security Scan
        run: python .github/scripts/security_scan.py . --strict
        shell: bash

      - name: Ruff Lint
        run: ruff check .
        shell: bash

      - name: Lint Budget (S/BLE families absent from .ruff.toml)
        run: python tools/check_lint_budget.py
        shell: bash

      - name: Schema Validation
        run: python tools/validate_schemas.py
        shell: bash

      - name: Garden (Drift Detection)
        run: python tools/garden.py
        shell: bash

      - name: Bootstrap Smoke Test (init.sh)
        run: bash init.sh --quiet
        shell: bash

      - name: Harness Tests (auto-discovers all tools/test_*.py)
        run: |
          set +e
          python -m pytest tools/ -v --tb=short > pytest.log 2>&1
          rc=$?
          grep -E "^(FAILED|ERROR)" pytest.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -40 pytest.log
          exit $rc
        shell: bash

  extended-gates:
    name: Extended Gates (prose, coverage, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
        shell: bash

      - name: Prose Budget
        run: python tools/prose_lint.py
        shell: bash

      - name: Coverage Ratchet
        run: |
          set +e
          python tools/coverage_gate.py > coverage.log 2>&1
          rc=$?
          grep -E "^\s+[A-Za-z0-9_.\\\\/-]+: |^\[FAIL\]|^\[OK\]" coverage.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -25 coverage.log
          exit $rc
        shell: bash

      - name: Coverage baseline capture
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python tools/coverage_gate.py --capture | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice::$line"
          done

      - name: Gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks dir . --no-banner -c .gitleaks.toml
        shell: bash

  ci-ok:
    name: CI — All Gates Passed
    needs: [quality-gates, extended-gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python -c "
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = [k for k, v in needs.items() if v.get('result') != 'success']
          if failed:
              print(f'FAILED: {failed}')
              sys.exit(1)
          print('All gates passed')
          "
